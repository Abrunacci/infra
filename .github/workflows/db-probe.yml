---
name: db-probe image

# Publishes the test image for per-project databases (tests/db-probe) as
# ghcr.io/<owner>/infra-db-probe:v1, v2 and v3. Run by hand only (Actions →
# db-probe image → Run workflow); nothing deploys it automatically. The
# package is private unless its visibility is changed on GitHub.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Build and push v1, v2 and v3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, push and report the digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/infra-db-probe"
          {
            echo "| Tag | Digest |"
            echo "|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          for version in v1 v2 v3; do
            docker build --pull --build-arg PROBE_VERSION="$version" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "$image:$version" tests/db-probe
            docker push -q "$image:$version"
            digest="$(docker image inspect -f '{{index .RepoDigests 0}}' "$image:$version")"
            echo "$version ${digest#*@}"
            echo "| \`$version\` | \`${digest#*@}\` |" >>"$GITHUB_STEP_SUMMARY"
          done
      - name: Log out
        if: always()
        run: docker logout ghcr.io
