---
name: Security scan

# The images the server runs (the *_image values in the roles' defaults),
# scanned with Trivy for vulnerabilities that have a fix. Weekly, on Monday
# after Renovate's update pull requests (renovate.json), by hand (Actions →
# Security scan → Run workflow), and on pull requests that change an image.
# It fails on a CRITICAL one, so GitHub emails its result; the job summary
# lists every HIGH and CRITICAL. Accepted findings: .trivyignore.yaml.
#
# Every scheduled or manual run also pings the "infra security scan" check in
# healthchecks.io, whatever the scan found: that check says whether the scan
# ran, the red run says what it found. healthchecks.io emails when a Monday
# goes by without a ping, so a schedule that stops firing is noticed.
on:
  schedule:
    # Off :00 and :30: GitHub delays scheduled runs under load, worst at the
    # start of the hour (on 2026-10-12, Outside check started 9 hours late).
    # The healthchecks.io check uses the same cron.
    - cron: "17 12 * * 1"  # 09:17 in Buenos Aires
  workflow_dispatch:
  pull_request:
    paths:
      - ansible/roles/*/defaults/main.yml
      - .trivyignore.yaml
      - .github/workflows/security-scan.yml
      - .github/scripts/trivy-summary.py

permissions:
  contents: read

env:
  # Run from its image, pinned by digest like every other image here.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  images:
    name: Scan the server's images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan each image
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          grep -hE '^[a-z_]+_image: ' ansible/roles/*/defaults/main.yml | awk '{print $2}' |
            while read -r image; do
              name="$(printf '%s' "${image%%@*}" | tr '/:' '__')"
              echo "::group::$image"
              # A failed scan leaves an empty report, which the summary counts as a failure.
              touch "$RUNNER_TEMP/reports/$name.json"
              docker run --rm \
                -v "$RUNNER_TEMP/reports:/reports" -v trivy-cache:/root/.cache \
                -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
                "$TRIVY_IMAGE" image --image-src remote --severity HIGH,CRITICAL --ignore-unfixed \
                --ignorefile /trivyignore.yaml --format json --output "/reports/$name.json" "$image" || true
              echo "::endgroup::"
            done
      - name: Summarize
        if: always()
        # Explicit, so the step runs with pipefail and fails with the script,
        # not with tee: without it, a CRITICAL finding left the run green.
        shell: bash
        run: python3 .github/scripts/trivy-summary.py "$RUNNER_TEMP/reports" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report the run to healthchecks.io
        if: always() && github.event_name != 'pull_request'
        env:
          SECURITY_SCAN_PING_URL: ${{ secrets.SECURITY_SCAN_PING_URL }}
        run: |
          if [ -z "$SECURITY_SCAN_PING_URL" ]; then
            echo "::error::SECURITY_SCAN_PING_URL is not set"
            exit 1
          fi
          curl -fsS --max-time 10 --retry 5 --retry-connrefused -o /dev/null "$SECURITY_SCAN_PING_URL"
          echo "Run reported to healthchecks.io."
