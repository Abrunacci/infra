name: Authorship

# Enforces who authors the commits of a pull request and what its
# description may contain.
#
# Self-contained on purpose: copy this file as-is into another repository's
# .github/workflows/ and change MAINTAINER below. It needs no checkout, no
# secrets and no other file; it reads the pull request through the API with
# the job's own read-only token.
#
# Rules, checked on every commit of the pull request (up to 250, the API's
# limit):
#   - author and committer are both exactly MAINTAINER, name and email;
#   - no Co-Authored-By trailer, whoever it names;
#   - no line starting with "Generated with" or "Generated by".
# And on the pull request description:
#   - no line starting with "Generated with" or "Generated by";
#   - no "Requested by ... · project thread" line;
#   - no hidden content (HTML comments).
#
# Commits made on github.com (a web edit, the "Update branch" button, a
# suggestion applied from a review) have GitHub as committer, so they fail:
# make those changes locally and push them.
#
# It runs again when the description is edited, so fixing the text turns the
# check green without a new push.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAINTAINER: Alejandro Brunacci <abrunacci87@gmail.com>
    steps:
      - name: Read the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Read from the API, not from the event: a re-run then sees the
        # description as it is now, not as it was when the run started.
        run: |
          gh api "repos/$REPO/pulls/$PR" > pr.json
          gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
            | jq -s 'add' > commits.json

      - name: Check commits and description
        shell: python3 {0}
        run: |
          import json
          import os
          import re
          import sys

          I = re.IGNORECASE | re.MULTILINE

          maintainer = os.environ["MAINTAINER"].strip()

          # (rule broken, pattern). Searched line by line in the text they
          # apply to; add or remove rows to change the policy.
          COMMIT_RULES = [
              ("Commits must not carry Co-Authored-By trailers",
               re.compile(r"^\s*co-authored-by\s*:", I)),
              ("Commit messages must not contain \"Generated with/by\" lines",
               re.compile(r"^[\W_]*generated\s+(with|by)\b", I)),
          ]
          DESCRIPTION_RULES = [
              ("PR descriptions must not contain \"Generated with/by\" lines",
               re.compile(r"^[\W_]*generated\s+(with|by)\b", I)),
              ("PR descriptions must not contain a \"Requested by ... project thread\" line",
               re.compile(r"requested\s+by\b.*project\s+thread", I)),
              ("PR descriptions must not contain hidden content (HTML comments)",
               re.compile(r"<!--", I)),
          ]

          problems = []

          with open("commits.json") as f:
              commits = json.load(f)
          for c in commits:
              sha = c["sha"][:7]
              for role in ("author", "committer"):
                  who = c["commit"][role]
                  identity = f"{who['name']} <{who['email']}>"
                  if identity != maintainer:
                      problems.append(
                          f"commit {sha}: {role} is {identity}. "
                          f"Commits must be authored and committed by the repository maintainer ({maintainer})."
                      )
              for rule, rx in COMMIT_RULES:
                  if rx.search(c["commit"]["message"] or ""):
                      problems.append(f"commit {sha}: {rule}.")

          with open("pr.json") as f:
              pr = json.load(f)
          for rule, rx in DESCRIPTION_RULES:
              if rx.search(pr.get("body") or ""):
                  problems.append(f"description: {rule}.")

          if not problems:
              print(f"OK: {len(commits)} commit(s) by {maintainer}; the description follows the rules.")
              sys.exit(0)

          for p in problems:
              print(f"::error::{p}")
          print()
          print("How to fix:")
          print("  - Description: edit the pull request; this check runs again on its own.")
          print("  - Commits: rewrite them as the maintainer and without the trailer or line,")
          print("    for example git rebase -i <base> --exec 'git commit --amend --no-edit")
          print("    --reset-author' with your own user.name and user.email set, then")
          print("    force-push the branch.")
          sys.exit(1)
