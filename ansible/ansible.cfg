# Read only when ansible-playbook runs from this directory.
[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = /usr/bin/python3
# The server's host key must already be in ~/.ssh/known_hosts (see README).
# Never turned off: an unknown or changed key stops the run.
host_key_checking = True
# Notified handlers (e.g. a Caddy reload) still run if a later task fails, so
# a change that is already on disk is never left unapplied.
force_handlers = True
callback_result_format = yaml
# Show only what changed, failed or needs attention, plus the recap: an
# idempotence run prints nothing but the recap.
display_ok_hosts = False
display_skipped_hosts = False
# Every run is logged outside the repo. ./play gives each run a file of its
# own (ANSIBLE_LOG_PATH); plain ansible-playbook appends to this one. The
# directory must exist (./play creates it). Tasks with no_log stay out.
log_path = ~/notas/infra/corridas/ansible.log

[privilege_escalation]
# The admin user's sudo asks for a password (roles/base/tasks/sudo.yml), so
# every run prompts for it, as with -K.
become_ask_pass = True

[ssh_connection]
pipelining = True
