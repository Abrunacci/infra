---
# The first domain in projects.yml (domains): status.<domain> lives there, and
# so does every project without a domain. The server's own name is its
# inventory host, one of projects.yml's servers.
# projects_registry is loaded before any role (site.yml, pre_tasks).
domain: "{{ projects_registry.domains[0].name }}"

# This server's entry in projects.yml (servers), and what it says. The first
# server serves the status page (roles/gatus) and runs every project without a
# server. A server with database: managed has no PostgreSQL of its own: its
# projects' databases are in a managed cluster (projects_managed_db, from
# Terraform; roles/projects, validate.yml). With ssh: tailscale, SSH answers
# only on the Tailscale interface (roles/hardening).
first_server: "{{ projects_registry.servers[0].name }}"
is_first_server: "{{ inventory_hostname == first_server }}"
# The others push their heartbeats to the first one's status page over HTTPS
# (roles/gatus).
other_servers: "{{ projects_registry.servers[1:] | map(attribute='name') | list }}"
server_entry: >-
  {{ projects_registry.servers | selectattr('name', 'equalto', inventory_hostname) | first | default({}) }}
database_managed: "{{ server_entry.database | default('local') == 'managed' }}"
ssh_via_tailscale: "{{ server_entry.ssh | default('public') == 'tailscale' }}"

# Memory: every container's limit is a whole percentage of its server's RAM
# (1% to 90%), turned into MiB on each run from the RAM the server reports
# (filter_plugins/memory.py), so the limits follow a resized Droplet. The
# backends' and workers' are in projects.yml (memory); these are the
# containers every server of a kind runs. Each server's limits add up to
# memory_max_share percent at most (roles/projects, validate.yml): the rest is
# the host's (dockerd, sshd, fail2ban, do-agent, the nightly backup).
memory_max_share: 90
# Every server.
caddy_memory: 5%
# The first server only, which serves the status page.
gatus_memory: 5%
# Only a server whose database is local.
postgres_memory: 30%

# The hostname of each public project (one with a subdomain), by name: its
# subdomain under its domain, or the domain itself for "@".
project_hosts: >-
  {%- set hosts = {} -%}
  {%- for p in projects_registry.projects if p.subdomain is defined -%}
  {%-   set d = p.domain | default(domain) -%}
  {%-   set _ = hosts.update({p.name: d if p.subdomain == '@' else p.subdomain ~ '.' ~ d}) -%}
  {%- endfor -%}
  {{ hosts }}

# Created by cloud-init (terraform/variables.tf, admin_user) and used by
# Ansible to connect. It is the only user allowed to log in over SSH.
admin_user: ops

# Every key allowed to log in as admin_user. The list is exclusive: keys not
# listed here are removed from the server. By default it is the same key
# Terraform installed (TF_VAR_admin_ssh_public_key in terraform/.env).
# To rotate, override the list in inventory.yml (see README).
admin_ssh_public_keys:
  - "{{ lookup('ansible.builtin.env', 'TF_VAR_admin_ssh_public_key') | trim }}"

# Runs deploy.sh for CI (roles/deploy). It can only log in with a project's
# deploy key, and every such key runs deploy.sh for that project only.
deploy_user: deploy

# Root-only directory for the secrets Ansible generates on the server.
# They never leave the server except inside the encrypted backups.
infra_secrets_dir: /etc/infra/secrets
# Compose projects and their configuration.
infra_opt_dir: /opt/infra

# Fixed subnet of the internal db network and fixed address of PostgreSQL on
# it (roles/docker, postgres and db_tunnel), so clients and the tunnel bridge
# never depend on the address Docker happened to assign.
# Docker hands out dynamic addresses only from db_network_dynamic_range, so a
# container without a fixed address can never take PostgreSQL's:
#   .2-.127   fixed addresses (PostgreSQL: .10)
#   .128-.255 dynamic addresses (project containers)
# 172.30.0.0/24 is inside Docker's default address pools but not in use on
# the server; Docker skips pool ranges that overlap a network created with an
# explicit subnet, so it will not hand it out to another network.
db_network_subnet: 172.30.0.0/24
db_network_dynamic_range: 172.30.0.128/25
postgres_ipv4_address: 172.30.0.10

# One internal network per project with a database, named db-<name>: only
# that project's backend (and its migrations) and PostgreSQL are on it, so
# backends cannot reach each other through it (#46). PostgreSQL answers on
# each one as postgres_host, the host in DATABASE_URL; Docker picks the
# subnets. The db network above stays for the database bridge (db_tunnel).
# Created by roles/postgres, which joins them all; removed by roles/projects.
# None on a server whose database is managed: its backends reach the cluster
# over their own networks' route out, and its migrations over db-egress
# (roles/docker).
database_networks: >-
  {{ [] if database_managed else projects_registry.projects | selectattr('database', 'defined')
     | selectattr('database') | map(attribute='name') | map('regex_replace', '^', 'db-') | list }}
postgres_host: postgres

# One network per public backend (a project with a subdomain and a backend),
# named edge-<name>. Only that backend and Caddy are on it, so backends cannot
# reach each other (#32). Ordinary bridges, not internal: they are also the
# backends' route out to the internet. Created by roles/caddy, which joins
# them all; removed by roles/projects once their project is gone.
edge_project_networks: >-
  {{ projects_registry.projects | selectattr('subdomain', 'defined') | selectattr('backend', 'defined')
     | map(attribute='name') | map('regex_replace', '^', 'edge-') | list }}

# Projects whose backend another one reaches directly: some backend has a
# secret {from: <name>, key: ...}. Each gets an internal network, link-<name>
# (no route out), shared by its backend (as <name>-backend) and the backends
# that link to it, and nobody else. Created and removed by roles/projects.
link_receivers: >-
  {%- set receivers = [] -%}
  {%- for p in projects_registry.projects if p.backend is defined -%}
  {%-   for kind in (p.backend.secrets | default({})).values() if kind is mapping -%}
  {%-     set _ = receivers.append(kind.from) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ receivers | unique | sort | list }}
link_networks: "{{ link_receivers | map('regex_replace', '^', 'link-') | list }}"

# Loopback port of the temporary PostgreSQL bridge (roles/db_tunnel), and the
# only destination admin_user may forward to over SSH (roles/hardening).
db_tunnel_port: 15432

# A managed database's client network (roles/docker): the one-off containers
# that connect to the cluster (project-db, the backups, the migrations) run on
# it, and it reaches only the cluster's address (db_egress in
# scripts/backend-lib.sh). Fixed, next to the db network's subnet, since the
# firewall rule names it. Only on a server whose database is managed.
db_egress_network: db-egress
db_egress_subnet: 172.30.1.0/24

# age public keys every backup is encrypted to (roles/backup). Public keys
# are not secret; their private keys never go on the server: they live in the
# password manager and on paper (ansible/README.md, "Backups"). Every backup
# can be decrypted with any one of them. Empty until the first key is created:
# the backups role refuses to run without one.
backup_age_recipients:
  - age1vvaxtrh24zkr49ny7zd42snggm748f9axwpza7xyhgq33vmr69lqc56j6p
