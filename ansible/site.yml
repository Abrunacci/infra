---
- name: Provision the server
  hosts: all
  become: true
  pre_tasks:
    # Before any change: a broken projects.yml, or one that leaves a database
    # without its project, stops the play here. Its database tasks are also
    # tagged projects_databases, the only ones meant to be skipped (to repair
    # Docker or PostgreSQL; see ansible/README.md).
    - name: Check the project registry
      ansible.builtin.import_role:
        name: projects
        tasks_from: validate
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: caddy
      tags: [caddy]
    - role: postgres
      tags: [postgres]
    - role: db_tunnel
      tags: [db_tunnel]
    - role: projects
      tags: [projects]
    - role: deploy
      tags: [deploy]
    - role: backup
      tags: [backup]
