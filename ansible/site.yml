---
- name: Provision the server
  hosts: all
  become: true
  pre_tasks:
    # Before any change: a broken projects.yml stops the play here.
    - name: Check the project registry
      ansible.builtin.import_role:
        name: projects
        tasks_from: validate
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: caddy
      tags: [caddy]
    - role: postgres
      tags: [postgres]
    - role: db_tunnel
      tags: [db_tunnel]
    - role: projects
      tags: [projects]
    - role: deploy
      tags: [deploy]
