---
- name: Provision the server
  hosts: all
  become: true
  pre_tasks:
    # Before any change: a broken projects.yml, or one that leaves a database
    # without its project, stops the play here. Its database tasks are also
    # tagged projects_databases, the only ones meant to be skipped (to repair
    # Docker or PostgreSQL; see ansible/README.md).
    - name: Check the project registry
      ansible.builtin.import_role:
        name: projects
        tasks_from: validate
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: hardening
      tags: [hardening]
    - role: monitoring
      tags: [monitoring]
    - role: docker
      tags: [docker]
    # Also with --tags projects: Caddy joins each public backend's network, so
    # adding or removing a project changes Caddy too.
    - role: caddy
      tags: [caddy, projects]
    # Also with --tags projects: PostgreSQL joins each database's network, so
    # adding a project with a database changes PostgreSQL too.
    - role: postgres
      tags: [postgres, projects]
    - role: db_tunnel
      tags: [db_tunnel]
    - role: projects
      tags: [projects]
    - role: deploy
      tags: [deploy]
    - role: backup
      tags: [backup]
    - role: gatus
      tags: [gatus]
