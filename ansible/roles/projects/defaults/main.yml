---
# The registry at the repo root, shared with Terraform.
projects_file: "{{ playbook_dir }}/../projects.yml"
# What the server knows about each project: read by deploy.sh (deploy PR)
# to check the project it is asked to deploy, and by this role to refuse
# changes that would lose data.
projects_server_registry: /etc/infra/projects.json

# Where validate.yml looks for the databases that exist on the server. Same
# names as roles/postgres (compose project, service and postgres_volume):
# roles/postgres is not loaded yet when validate.yml runs.
projects_postgres_compose_project: postgres
projects_postgres_compose_service: postgres
projects_postgres_volume: postgres_data

# Static sites. Each project with site: true gets
#   /srv/sites/<name>/placeholder/     root's; shown until the first deploy
#   /srv/sites/<name>/releases/<id>/   one directory per deployed version,
#                                      owned by the sites user (deploys)
#   /srv/sites/<name>/current          symlink to what Caddy serves
# Root never writes inside releases/: the sites user could otherwise replace a
# directory there with a symlink and make root write elsewhere.
projects_sites_dir: /srv/sites
# Fixed, like caddy_uid (10001) and db_tunnel_uid (10002): never a dynamic
# system uid that could match PostgreSQL's (999).
projects_sites_uid: 10003
# Caddy's per-project site files (imported by its Caddyfile).
projects_caddy_sites_dir: "{{ caddy_dir }}/conf/sites"

# A project's CI key: ed25519, one line, an optional simple comment. Same
# pattern as projects.schema.json.
projects_deploy_key: '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/]{48}( [A-Za-z0-9._@-]{1,64})?\Z'

# Backends: one container per project with a backend, run with Compose.
#   /opt/infra/projects/<name>/             compose.yml and app.env (the
#                                           non-secret env from projects.yml)
#   /etc/infra/secrets/projects/<name>/     secrets.env (root only), set with
#                                           project-secret or generated
#   /var/lib/infra/backends/<name>/         release.env (the deployed image)
#                                           and releases (the history)
projects_backends_dir: "{{ infra_opt_dir }}/projects"
projects_backends_secrets_dir: "{{ infra_secrets_dir }}/projects"
projects_backends_state_dir: /var/lib/infra/backends
# Credentials for pulling private images (docker login, see ansible/README.md).
projects_registry_config_dir: "{{ infra_secrets_dir }}/registry"
# Every backend container runs as this user, whatever its image declares.
# Fixed, like caddy (10001), db-tunnel (10002), sites (10003) and deploy
# (10004). No login, no home, owns no file on the host.
projects_backends_uid: 10005
projects_backend_default_memory: 256m
# memory, and each server's max_memory in projects.yml: 64m to 2048m. A
# container's memory goes up to its server's max_memory, 512m by default (the
# first Droplet's size); max_cpus likewise caps cpus, 1 by default.
projects_memory_re: '^(6[4-9]|[7-9][0-9]|[1-9][0-9]{2}|1[0-9]{3}|20[0-3][0-9]|204[0-8])m\Z'
projects_server_default_max_memory: 512m
projects_server_default_max_cpus: 1
# Each server's entry by name (a server named twice is refused in validate.yml).
projects_server_limits: >-
  {{ dict(projects_registry.servers | selectattr('name', 'defined') | map(attribute='name')
          | zip(projects_registry.servers | selectattr('name', 'defined'))) }}
# Half of the Droplet's one CPU: a backend under load (a flood of requests,
# a hot loop) slows down itself instead of starving the other backends,
# Caddy and PostgreSQL. PostgreSQL has no limit.
projects_backend_default_cpus: 0.5
# Largest request body Caddy passes to a backend (projects.yml, max_body).
# Larger ones get 413 before reaching it.
projects_backend_default_max_body: 10MB
# Env names the infrastructure sets itself (per-project databases): a project
# cannot set them in env or secrets.
projects_backend_reserved_env:
  [DATABASE_URL, DATABASE_DIRECT_URL, MIGRATION_DATABASE_URL, APP_DB_USER, APP_DB_PASSWORD]

# A managed database (projects.yml, servers: database: managed). Its host,
# port, admin user and CA come from Terraform (validate.yml, projects_managed_db);
# the pool's port is DigitalOcean's for every pool.
projects_db_pool_port: 25061
# Read from Terraform's outputs on the machine running the playbook (with
# terraform/.env loaded, as for every run): only once, and only for a server
# whose database is managed (validate.yml).
projects_managed_db_terraform_output: >-
  {{ lookup('ansible.builtin.pipe', 'terraform -chdir=' ~ (playbook_dir ~ '/../terraform') | quote
     ~ ' output -json production_database') }}
# The cluster's CA, where the backends, the migrations and the client find it.
projects_database_ca: /etc/infra/database-ca.crt
projects_database_ca_in_container: /run/infra/database-ca.crt
# psql, pg_dump and pg_restore for a managed database, in one-off containers:
# the same image as roles/postgres (postgres_image), the cluster's major
# version. Renovate updates both lines.
projects_db_client_image: postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f

# Linked secrets ({from: PROJECT, key: KEY}), one item per secret:
# {project, server, key, link}. Checked in validate.yml.
# A project without a server is on the first one.
projects_links: >-
  {%- set links = [] -%}
  {%- for p in projects_registry.projects if p.backend is defined and p.backend is mapping -%}
  {%-   for key, kind in (p.backend.secrets | default({})).items() if kind is mapping -%}
  {%-     set _ = links.append({'project': p.name, 'server': p.server | default(projects_registry.servers[0].name),
                                'key': key, 'link': kind}) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ links }}
# Env values that name another backend on the server
# (http://PROJECT-backend[:PORT]/...), one item per value:
# {project, server, key, value, host, port, linked}, where linked is every
# project this one links a secret from. Checked in validate.yml.
projects_backend_url: '^https?://([a-z0-9-]+)-backend(?::([0-9]*))?(?:[/?#]|$)'
projects_backend_urls: >-
  {%- set urls = [] -%}
  {%- for p in projects_registry.projects if p.backend is defined and p.backend is mapping -%}
  {%-   for key, value in (p.backend.env | default({})).items()
          if value is string and value is match(projects_backend_url) -%}
  {%-     set m = value | regex_search(projects_backend_url, '\\1', '\\2') -%}
  {%-     set _ = urls.append({'project': p.name, 'server': p.server | default(projects_registry.servers[0].name),
                               'key': key, 'value': value, 'host': m[0], 'port': m[1] or '',
                               'linked': (p.backend.secrets | default({})).values() | select('mapping')
                                         | map(attribute='from') | list}) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ urls }}
