---
# The registry was loaded and checked in validate.yml (site.yml, pre_tasks),
# together with the databases already on the server.

# Skipping the database check (--skip-tags projects_databases) is only for
# repairing Docker or PostgreSQL with --tags docker,postgres. This role would
# otherwise rewrite the registry the check relies on.
- name: Require the database check
  ansible.builtin.assert:
    that:
      - projects_databases_probe is defined
      - projects_databases_probe is not skipped
    fail_msg: >-
      The database check was skipped (--skip-tags projects_databases). That is only for
      --tags docker,postgres; run the playbook without it.
    quiet: true

# Backends and databases are built in a later PR. Until then, a project that
# needs a backend fails here instead of half existing.
- name: Refuse components that are not supported yet
  ansible.builtin.assert:
    that:
      - item.backend is not defined
    fail_msg: "projects.yml: {{ item.name }} has a backend; backend projects are not supported yet."
    quiet: true
  loop: "{{ projects_registry.projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the registry for the server
  ansible.builtin.template:
    src: projects.json.j2
    dest: "{{ projects_server_registry }}"
    owner: root
    group: root
    mode: "0644"

- name: Serve the static sites
  ansible.builtin.import_tasks: sites.yml
  vars:
    projects_sites: "{{ projects_registry.projects | selectattr('site') | list }}"
