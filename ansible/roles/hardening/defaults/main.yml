---
# Users allowed to log in over SSH: the admin, and the deploy user, whose keys
# can only run deploy.sh (roles/deploy).
hardening_ssh_allow_users:
  - "{{ admin_user }}"
  - "{{ deploy_user }}"

# The one exception to "no forwarding": admin_user may open local forwards
# (ssh -L), and only to these destinations. Everyone else keeps none.
# db_tunnel_port is in group_vars because roles/db_tunnel uses it too.
hardening_ssh_forward_user: "{{ admin_user }}"
hardening_ssh_permit_open:
  - "127.0.0.1:{{ db_tunnel_port }}"

# Same inbound rules as the cloud firewall (terraform/firewall.tf), as a second
# layer. ICMP and ICMPv6 are allowed by ufw's default before.rules and
# before6.rules, which this role leaves untouched: IPv6 needs "Packet Too Big"
# for path MTU discovery.
hardening_ufw_rules:
  - { port: "22", proto: tcp, comment: SSH }
  - { port: "80", proto: tcp, comment: HTTP }
  - { port: "443", proto: tcp, comment: HTTPS }
  - { port: "443", proto: udp, comment: HTTP/3 }

hardening_fail2ban_maxretry: 5
hardening_fail2ban_findtime: 10m
hardening_fail2ban_bantime: 1h
