---
- name: Install ufw and fail2ban
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      # Lets fail2ban read sshd's log from the systemd journal.
      - python3-systemd
    state: present

- name: Harden the SSH server
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

# The allow rules go in before ufw is enabled, so the SSH session running this
# playbook is never cut off.
- name: Allow inbound SSH and HTTP(S)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ hardening_ufw_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Deny any other inbound traffic
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outbound traffic
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Configure the fail2ban SSH jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban at boot
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
