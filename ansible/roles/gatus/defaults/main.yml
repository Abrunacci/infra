---
# Gatus: the status page (status.<domain>) and the alerts when a check fails.
# What it checks is generated from projects.yml (templates/config.yaml.j2).

# Pinned by digest, like every other image. The same digest is published on
# Docker Hub as twinproduction/gatus.
gatus_image: ghcr.io/twin/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
gatus_dir: "{{ infra_opt_dir }}/gatus"
# The check history (SQLite). Not backed up: losing it only empties the
# status page's history.
gatus_data_dir: /var/lib/infra/gatus
# The alert settings: alerts.env (written here) and the channel's credentials
# (written on the server by gatus-credentials). Root only.
gatus_secrets_dir: "{{ infra_secrets_dir }}/gatus"
gatus_memory_limit: 128m
# Fixed, like caddy (10001) through backends (10005).
gatus_uid: 10006

# How often each site is checked, and how long a check may take.
gatus_check_interval: 1m
gatus_check_timeout: 10s
# A site's certificate must be valid for at least this long. Caddy renews
# well before; this fires only if renewing keeps failing.
gatus_certificate_min_validity: 168h

# Heartbeats: results the server itself pushes to Gatus (gatus-heartbeats),
# for what Gatus cannot check from its container. Gatus alerts when one
# reports a failure, and when none arrives for its interval. The list is
# templates/heartbeats.yaml.j2. They reach Gatus on this loopback port only:
# Caddy passes nothing but GET and HEAD from outside, and every push carries a
# token generated on the server (push.env, root only).
gatus_push_port: 18080
# The server's own checks (gatus-heartbeats.timer): the DigitalOcean agent and
# the health of each internal backend (no subdomain, so no URL to check).
# A systemd calendar: every 5 minutes.
gatus_host_check_calendar: "*:0/5"
# No push for this long means the checks themselves stopped. Gatus looks once
# per interval, so it notices between one and two intervals later.
gatus_host_heartbeat: 15m
# Failed pushes in a row before an alert: one more than a single check, so a
# check that lands on a restart (an agent upgrade, a deploy) stays quiet.
gatus_host_failure_threshold: 2
# The nightly backup alerts on the first failed run. Without any run, it
# alerts once the last successful one is older than this (the login warning's
# limit, roles/backup).
gatus_backup_max_age_hours: "{{ backup_max_age_hours | default(26) }}"
# The monthly restore drill (ansible/README.md, "The restore drill, once a
# month"): fails once a project with a database has had no passing drill for
# this many days. A month and a few days of slack.
gatus_drill_max_days: 35
# Credentials that expire: fails this many days before the first one does.
# The dates are the "Expires" column of terraform/README.md, "Credentials",
# read by the playbook: a row without a date there is not checked. After
# rotating one, write its new date there and run the playbook (--tags gatus).
gatus_credentials_table: "{{ playbook_dir }}/../terraform/README.md"
gatus_credentials_warn_days: 14

# The check from outside the server: gatus-heartbeats pings healthchecks.io
# at the end of every run (gatus_host_check_calendar), and healthchecks.io
# alerts if the pings stop, which is what happens when the whole server, or
# Gatus, is down. The ping URL is stored on the server by
# `gatus-credentials healthchecks`; until then, every playbook run ends with
# a warning (tasks/healthchecks.yml).
gatus_healthchecks_ping_base: https://hc-ping.com

# The server's security check (server-posture, tasks/server-posture.yml):
# listening sockets, published ports, ufw, sshd, fail2ban and updates, against
# what the roles set up. It reports to its own check on healthchecks.io, never
# to Gatus: the status page is public. Every hour, at 20 past.
gatus_posture_calendar: "*:20"
# The jails roles/hardening (sshd) and roles/caddy set up.
gatus_posture_fail2ban_jails: [sshd, caddy-auth, caddy-flood]
# unattended-upgrades reboots every day at base_auto_reboot_time when an update
# needs it: a reboot pending longer than this means that did not happen.
gatus_posture_reboot_max_hours: 36

# Log alerts: the backends' log lines projects.yml asks to hear about
# (log_alerts), and the server's own (below), emailed by log-alerts on the
# same calendar as the heartbeats (gatus_host_check_calendar), which also
# gives its heartbeat's interval.
# One email per run, with at most this many lines; the rest are counted.
gatus_log_alerts_max_lines: 20
# The server's own log alerts, read from the journal like the backends' but by
# syslog identifier, under the name "server". Same fields as log_alerts in
# projects.yml, plus identifiers. Patterns are anchored at the start of the
# message, so text a command or a client chose (a sudo command line, an SSH
# user name) cannot fake or hide a match. They carry the address someone
# logged in from: yours, normally.
gatus_log_alerts_server_rules:
  - name: ops-login
    # sshd-session is sshd's name for this process from OpenSSH 9.8 on.
    identifiers: [sshd, sshd-session]
    match: ['^Accepted publickey for ops from ']
    subject:
      pattern: '^Accepted publickey for (?P<user>\S+) from (?P<address>\S+)'
      format: "{user} logged in over SSH from {address}"
    note: >-
      Someone logged in as ops with the admin key: you, or the playbook you ran. If it was not you, rotate
      the key now (ansible/README.md, "Rotating the admin SSH key").
  - name: unexpected-login
    identifiers: [sshd, sshd-session]
    match: ['^Accepted (?!publickey for (ops|deploy) from )']
    note: >-
      A login that sshd should never allow: another user, or a method other than a key. Find out how
      (sudo sshd -T, /etc/ssh/sshd_config.d) and treat the server as compromised until you know.
  - name: sudo-failure
    identifiers: [sudo]
    # sudo's verdict, before the command line it logs.
    match:
      - '^\s*\S+ : (\d+ incorrect password attempts?|user NOT in sudoers|command not allowed|a password is required) ;'
    note: >-
      sudo refused someone: a wrong password, or a user or command it does not allow. A mistyped password
      at -K is you; anything else is not.
  - name: deploy-failed
    identifiers: [deploy, deploy-backend]
    match: ['^result=failed ']
    subject:
      pattern: 'project=(?P<project>\S+)'
      format: "deploy failed for {project}"
    note: >-
      A deploy was refused or failed; the running release is untouched. The reason is in the line. If no
      workflow of yours failed at that time, someone else has a deploy key.
  - name: out-of-memory
    # The kernel's own line when it kills a process: inside a container that
    # reached its memory limit (Memory cgroup), or anywhere when the whole
    # server ran out. Docker then restarts the container.
    identifiers: [kernel]
    match: ['^(Memory cgroup out of memory|Out of memory): Killed process \d+ \(']
    subject:
      pattern: '^(?P<scope>Memory cgroup out of memory|Out of memory): Killed process \d+ \((?P<process>[^)]*)\)'
      format: "{process} killed: {scope}"
    note: >-
      The kernel killed a process for lack of memory. "Memory cgroup" means one container reached its limit
      (projects.yml, memory) and was restarted: an upload or a request too big for it, or a leak. Plain "Out of
      memory" means the whole server ran out. Which container: sudo journalctl -k -g oom-kill --since -1h shows its id
      in task_memcg=, and sudo docker ps --no-trunc | grep <id> names it.
# Once a day, the first run after this hour (UTC; 11 is 08:00 in Argentina)
# counts fail2ban's bans of the last 24 hours, and emails the counts (never
# the addresses) if a jail other than the quiet ones banned anyone.
gatus_log_alerts_bans_digest_hour: 11
gatus_log_alerts_bans_quiet_jails: [sshd]

# Where the alerts go. Each channel is one file, templates/alerting-<channel>.yaml.j2,
# plus its credentials (<channel>.env). Changing channels: ansible/README.md,
# "Status page and alerts".
gatus_alert_channel: email
# Failures in a row before an alert (one per check interval), and successes in
# a row before it is resolved. Every channel uses them.
gatus_alert_failure_threshold: 3
gatus_alert_success_threshold: 2

# The email channel: Resend's SMTP server. Port 2587 (STARTTLS): DigitalOcean
# blocks outgoing SMTP on 25, 465 and 587.
gatus_smtp_host: smtp.resend.com
gatus_smtp_port: 2587
gatus_smtp_username: resend
# On the domain verified in Resend (terraform/email.tf).
gatus_email_from: "Status <status@mail.{{ domain }}>"
# The same address DigitalOcean's resource alerts go to (terraform/.env).
gatus_alert_email: "{{ lookup('ansible.builtin.env', 'TF_VAR_alert_email') | trim }}"
