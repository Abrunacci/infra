---
# The last task of every run (site.yml, post_tasks), whatever --tags are
# given. Without the ping URL nothing outside the server notices it going
# down, and that must not go unseen: the run does not stop, but this task
# fails, shows as "...ignoring" at the very end, counts as ignored=1 in the
# PLAY RECAP, and is listed in the run log's summary (./play).

# Written by `gatus-credentials healthchecks` on the server; never passes
# through Ansible.
- name: Look for the healthchecks.io ping URL
  ansible.builtin.stat:
    path: "{{ gatus_secrets_dir }}/healthchecks.env"
  register: gatus_healthchecks

- name: "WARNING: no check from outside the server (healthchecks.io)"
  ansible.builtin.assert:
    that: gatus_healthchecks.stat.exists
    fail_msg: >-
      The server has no check from outside: if it goes down, nobody is told. On the server, run:
      sudo gatus-credentials healthchecks (see ansible/README.md, "Status page and alerts").
    quiet: true
  register: gatus_healthchecks_warning
  ignore_errors: true

# The same for the server's security check (server-posture): its ping URL is
# stored by `gatus-credentials server-posture`.
- name: Look for the server posture check's ping URL
  ansible.builtin.stat:
    path: "{{ gatus_secrets_dir }}/server-posture.env"
  register: gatus_posture_ping

- name: "WARNING: the server's security check reports nowhere (healthchecks.io)"
  ansible.builtin.assert:
    that: gatus_posture_ping.stat.exists
    fail_msg: >-
      server-posture checks the server every hour, but nothing hears about a difference. On the server, run:
      sudo gatus-credentials server-posture (see ansible/README.md, "The server's security check").
    quiet: true
  register: gatus_posture_ping_warning
  ignore_errors: true
