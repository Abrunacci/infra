---
# The alert address comes from terraform/.env, like the resource alerts', and
# never from the repo (it is public).
- name: Check the alert settings
  ansible.builtin.assert:
    that:
      - gatus_alert_email is match('^[^@\s]+@[^@\s]+\.[a-z]{2,}\Z')
      - gatus_alert_channel is match('^[a-z0-9-]+\Z')
    fail_msg: >-
      The alerts need TF_VAR_alert_email from terraform/.env loaded in this shell (see ansible/README.md,
      "Usage").
    quiet: true

# The heartbeats Gatus waits for and the server pushes: one list for both
# sides (the template's header says what each field is).
- name: List the heartbeats
  ansible.builtin.set_fact:
    gatus_heartbeats: "{{ lookup('ansible.builtin.template', 'heartbeats.yaml.j2') | from_yaml }}"

# Gatus refuses an alert description with " or \ in it (and so the whole
# config, on the server): caught here, before anything changes.
- name: Check the heartbeats' descriptions
  ansible.builtin.assert:
    that:
      - gatus_heartbeats | map(attribute='description') | select('search', '["\\\\]') | list | length == 0
    fail_msg: >-
      A description in templates/heartbeats.yaml.j2 has a double quote or a backslash, which Gatus refuses.
    quiet: true

# The credentials that expire, from the table in terraform/README.md,
# "Credentials" (the one whose header starts "| Variable | What it is |"): its
# first column (the name, without backticks or notes in parentheses) and the
# first date in its last one ("~2027-10-01 (to confirm in the panel)" counts).
# Rows without a date are not checked. If none had one, the table's format
# changed: the check would watch nothing, so the run stops instead.
- name: List the credentials that expire
  ansible.builtin.set_fact:
    gatus_credentials: >-
      {%- set found = [] -%}
      {%- set table = namespace(on=false, done=false) -%}
      {%- for line in lookup('ansible.builtin.file', gatus_credentials_table).splitlines() if not table.done -%}
      {%-   if line.startswith('| Variable | What it is |') -%}
      {%-     set table.on = true -%}
      {%-   elif table.on and not line.startswith('|') -%}
      {%-     set table.done = true -%}
      {%-   elif table.on and not line.startswith('|---') -%}
      {%-     set cells = line.strip().strip('|').split('|') -%}
      {%-     set date = cells[-1] | regex_search('(?<![0-9])20[0-9]{2}-[01][0-9]-[0-3][0-9](?![0-9])') -%}
      {%-     if date -%}
      {%-       set _ = found.append({'expires': date,
                  'name': cells[0] | regex_replace('[(][^)]*[)]', '') | replace('`', '') | trim}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ found }}

- name: Check the credentials' table
  ansible.builtin.assert:
    that:
      - gatus_credentials | length > 0
      - gatus_credentials | map(attribute='name') | select('match', '^[A-Za-z0-9_ ,.-]{1,80}$') | list | length
        == gatus_credentials | length
    fail_msg: >-
      No credential with an expiration date in {{ gatus_credentials_table }} ("Credentials"), or a name
      with unexpected characters: the Credentials heartbeat would check nothing.
    quiet: true

# Gatus runs as this unprivileged user inside the container. It owns the
# check history, and nothing else.
- name: Create the gatus system group
  ansible.builtin.group:
    name: gatus
    gid: "{{ gatus_uid }}"
    system: true

- name: Create the gatus system user
  ansible.builtin.user:
    name: gatus
    uid: "{{ gatus_uid }}"
    group: gatus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the Gatus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ gatus_dir }}", owner: root, mode: "0755" }
    - { path: "{{ gatus_dir }}/config", owner: root, mode: "0755" }
    - { path: "{{ gatus_secrets_dir }}", owner: root, mode: "0700" }
    # Also created by roles/base. Listed before its subdirectory: Ansible
    # would give a missing parent the subdirectory's mode.
    - { path: /var/lib/infra, owner: root, mode: "0755" }
    - { path: "{{ gatus_data_dir }}", owner: gatus, mode: "0700" }
  loop_control:
    label: "{{ item.path }}"

- name: Install the Gatus commands
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - gatus-validate
    - gatus-credentials
    - gatus-heartbeats
    - log-alerts
    - server-posture

- name: Write the settings gatus-credentials reads
  ansible.builtin.template:
    src: gatus.conf.j2
    dest: /etc/infra/gatus.conf
    owner: root
    group: root
    mode: "0644"

- name: Write the heartbeats gatus-heartbeats pushes
  ansible.builtin.template:
    src: gatus-heartbeats.conf.j2
    dest: /etc/infra/gatus-heartbeats.conf
    owner: root
    group: root
    mode: "0644"

- name: Write the credentials' expiration dates gatus-heartbeats checks
  ansible.builtin.template:
    src: credentials-expiry.conf.j2
    dest: /etc/infra/credentials-expiry.conf
    owner: root
    group: root
    mode: "0644"

# The token every heartbeat is pushed with. Made once, on the server, and
# never shown: Gatus reads it from this file, and so does gatus-heartbeats.
# Not backed up: a rebuilt server makes a new one. Written to a temporary file
# first, so a failure never leaves an empty one.
- name: Generate the heartbeats' token
  ansible.builtin.shell:
    cmd: >-
      umask 077 && printf 'GATUS_PUSH_TOKEN=%s\n' "$(openssl rand -hex 32)" > "$f.tmp" && mv "$f.tmp" "$f"
      || { rm -f "$f.tmp"; exit 1; }
    creates: "{{ gatus_secrets_dir }}/push.env"
  environment:
    f: "{{ gatus_secrets_dir }}/push.env"
  no_log: true

# Not shown in --diff or the run's log: the address is kept out of the repo.
# A change recreates the container at "Start Gatus" (Compose compares the
# environment it gives it).
- name: Write the alert address
  ansible.builtin.template:
    src: alerts.env.j2
    dest: "{{ gatus_secrets_dir }}/alerts.env"
    owner: root
    group: root
    mode: "0600"
  diff: false

# Pulled before the config is validated with it.
- name: Pull the Gatus image
  community.docker.docker_image_pull:
    name: "{{ gatus_image }}"
    pull: not_present

# Written by gatus-credentials on the server; never passes through Ansible.
- name: Look for the alert channel's credentials
  ansible.builtin.stat:
    path: "{{ gatus_secrets_dir }}/{{ gatus_alert_channel }}.env"
  register: gatus_credentials

# Only on the first run: the command it names was installed above. Gatus is
# not started without them, since every alert would be dropped.
- name: Require the alert channel's credentials
  ansible.builtin.assert:
    that: gatus_credentials.stat.exists
    fail_msg: >-
      Gatus has no credentials to send alerts with. On the server, run: sudo gatus-credentials
      (see ansible/README.md, "Status page and alerts"), then run the playbook again.
    quiet: true

# Checked in a throwaway container, with the same env files, before it
# replaces the current file: Gatus reloads it by itself, and exits on a broken
# one.
- name: Write the Gatus config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ gatus_dir }}/config/config.yaml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      /usr/local/sbin/gatus-validate {{ gatus_image }} {{ gatus_uid }} %s {{ gatus_alert_channel }}
      {{ gatus_secrets_dir }}/alerts.env {{ gatus_secrets_dir }}/{{ gatus_alert_channel }}.env
      {{ gatus_secrets_dir }}/push.env
  notify: Restart Gatus

- name: Write the Gatus compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ gatus_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/env docker compose --file %s config --quiet

# Recreates the container when compose.yml, an env file or the image changes;
# otherwise leaves it running.
- name: Start Gatus
  community.docker.docker_compose_v2:
    project_src: "{{ gatus_dir }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 120

- name: Apply Gatus config changes now
  ansible.builtin.meta: flush_handlers

# The image has no healthcheck. This asks Gatus from Caddy's container, the
# way the status page reaches it.
- name: Check that Caddy reaches Gatus
  community.docker.docker_compose_v2_exec:
    project_src: "{{ caddy_dir }}"
    service: caddy
    command: wget -q -O /dev/null http://gatus:8080/health
  register: gatus_health
  until: gatus_health.rc == 0
  retries: 15
  delay: 2
  changed_when: false

- name: Install the heartbeats' service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - gatus-heartbeats.service
    - gatus-heartbeats.timer
  notify: Reload systemd for the heartbeats

- name: Apply the heartbeats' systemd changes now
  ansible.builtin.meta: flush_handlers

- name: Start the heartbeats' timer
  ansible.builtin.systemd_service:
    name: gatus-heartbeats.timer
    enabled: true
    state: started

# Also proves the server reaches Gatus on its loopback port, with the token.
# Retried: a config change has just restarted Gatus.
- name: Push the server's checks now
  ansible.builtin.command:
    argv: [/usr/local/sbin/gatus-heartbeats]
  register: gatus_push
  until: gatus_push.rc == 0
  retries: 15
  delay: 2
  changed_when: false

# After the heartbeats: each run of log-alerts pushes to its own.
- name: Set up the log alerts
  ansible.builtin.import_tasks: log-alerts.yml

- name: Set up the server's security check
  ansible.builtin.import_tasks: server-posture.yml

- name: Remove older Gatus images
  ansible.builtin.command:
    argv: [/usr/local/sbin/prune-images, "{{ gatus_image }}"]
  register: gatus_prune
  changed_when: gatus_prune.stdout | length > 0
