---
# Gatus also reloads its config by itself when the file changes; the restart
# makes the change certain. The history is kept (SQLite).
- name: Restart Gatus
  community.docker.docker_compose_v2:
    project_src: "{{ gatus_dir }}"
    state: restarted

# Named apart from roles/backup's "Reload systemd": handler names are global.
- name: Reload systemd for the heartbeats
  ansible.builtin.systemd_service:
    daemon_reload: true
