---
# The public keys and the account ID must be set before anything else: a
# backup job that could not encrypt, or upload, is worse than none, because it
# looks like one.
- name: Check the backup settings
  ansible.builtin.assert:
    that:
      - backup_age_recipients is sequence and backup_age_recipients is not string
      - backup_age_recipients | length > 0
      - backup_age_recipients | reject('match', '^age1[0-9a-z]{58}\Z') | list | length == 0
      - backup_cloudflare_account_id is match('^[0-9a-f]{32}\Z')
      - inventory_hostname in backup_buckets
    fail_msg: >-
      Backups need backup_age_recipients (age public keys, age1..., in group_vars/all/main.yml; see
      ansible/README.md, "Backups"), TF_VAR_cloudflare_account_id from terraform/.env loaded in this shell, and
      this server's bucket in backup_buckets (roles/backup defaults, and terraform/backup-bucket).
    quiet: true

- name: Install age
  ansible.builtin.apt:
    name: age
    state: present

# Pulled here, so a backup never downloads anything but the backup itself
# (docker run --pull never).
- name: Pull the rclone image
  community.docker.docker_image_pull:
    name: "{{ backup_rclone_image }}"
    pull: not_present

- name: Create the backup directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    # The R2 credentials (backup-credentials).
    - { path: "{{ infra_secrets_dir }}/backup", mode: "0700" }
    # Also created by roles/base. Listed before its subdirectory: Ansible
    # would give a missing parent the subdirectory's mode.
    - { path: /var/lib/infra, mode: "0755" }
    # The last run's result, public: the login warning reads it, so it and
    # every directory above it must be readable by everyone.
    - { path: /var/lib/infra/backup, mode: "0755" }
    # Also created by roles/projects; this role must not depend on it.
    - { path: /usr/local/lib/infra, mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

# Only on the servers in backup_restore_test_servers (defaults).
- name: Set up the restore test key
  when: backup_restore_test
  block:
    - name: Look for the restore test key
      ansible.builtin.stat:
        path: "{{ backup_test_key }}"
        get_checksum: false
      register: backup_test_key_stat

    - name: Note whether the restore test key exists
      ansible.builtin.set_fact:
        backup_test_key_exists: "{{ backup_test_key_stat.stat.exists }}"

    # The restore test's key (backup-restore test, restore-test.timer): made here,
    # once, and never copied anywhere. Its public key joins the recipients, so
    # every backup from now on can be restored with nobody there; the admin's key
    # stays off the server. It decrypts this server's backups only: each server
    # has its own, and its own bucket.
    - name: Create this server's restore test key
      ansible.builtin.command:
        argv: [age-keygen, -o, "{{ backup_test_key }}"]
        creates: "{{ backup_test_key }}"

    - name: Keep the restore test key root only
      ansible.builtin.file:
        path: "{{ backup_test_key }}"
        owner: root
        group: root
        mode: "0600"
      # In check mode, before the first run, the key does not exist yet.
      when: not ansible_check_mode or backup_test_key_exists

    - name: Read the restore test key's public key
      ansible.builtin.command:
        argv: [age-keygen, -y, "{{ backup_test_key }}"]
      register: backup_test_public_key
      changed_when: false
      check_mode: false
      when: not ansible_check_mode or backup_test_key_exists

    - name: Check the restore test key's public key
      ansible.builtin.assert:
        that:
          - backup_test_public_key.stdout is match('^age1[0-9a-z]{58}\Z')
        fail_msg: >-
          {{ backup_test_key }} is not an age key: move it away and run the playbook again, which makes a
          new one.
        quiet: true
      when: backup_test_public_key is not skipped

- name: Write the backup configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: backup.conf.j2, dest: /etc/infra/backup.conf }
    - { src: backup-recipients.txt.j2, dest: /etc/infra/backup-recipients.txt }
  loop_control:
    label: "{{ item.dest }}"

- name: Install the backup commands
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    # Sourced by the three commands; never executed.
    - { src: backup-lib.sh, dest: /usr/local/lib/infra/backup.sh, mode: "0644" }
    - { src: backup-run, dest: /usr/local/sbin/backup-run, mode: "0755" }
    - { src: backup-restore, dest: /usr/local/sbin/backup-restore, mode: "0755" }
    - { src: backup-credentials, dest: /usr/local/sbin/backup-credentials, mode: "0755" }
    - { src: backup-login.sh, dest: /etc/profile.d/backup-status.sh, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"

- name: Install the backup and restore test services and their timers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: >-
    {{ ['backup.service', 'backup.timer']
       + (['restore-test.service', 'restore-test.timer'] if backup_restore_test else []) }}
  notify: Reload systemd

- name: Apply systemd changes now
  ansible.builtin.meta: flush_handlers

# Enabled even before the R2 credentials are stored: until then every run
# fails, and the login warning says so, instead of backups silently not
# existing.
- name: Start the daily backup timer
  ansible.builtin.systemd_service:
    name: backup.timer
    enabled: true
    state: started

# Its first runs fail until a backup made after the key exists (the older ones
# are not encrypted to it): ansible/README.md, "The automatic restore test".
- name: Start the daily restore test timer
  ansible.builtin.systemd_service:
    name: restore-test.timer
    enabled: true
    state: started
  when: backup_restore_test

# After backup.conf names the new image: before that, a backup starting now
# would still ask for the old one (with --pull never). A backup running now
# keeps its image until a later run.
- name: Remove older rclone images
  ansible.builtin.command:
    argv: [/usr/local/sbin/prune-images, "{{ backup_rclone_image }}"]
  register: backup_prune
  changed_when: backup_prune.stdout | length > 0
