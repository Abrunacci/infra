---
# Encrypted off-site backups to R2 (terraform/backup-bucket). What is backed
# up and how: scripts/backup-run; how to restore: scripts/backup-restore.

# The same image and version used to test the bucket's lock (#17), pinned by
# digest like every other image.
backup_rclone_image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
# One bucket per server (terraform/backup-bucket, backup_buckets), each with
# its own S3 credentials: a server never lists or reads another's backups.
backup_buckets:
  server.abrunacci.dev: infra-backups
  server.epbstock.com.ar: epb-production-backups
backup_bucket: "{{ backup_buckets[inventory_hostname] }}"
# R2's S3 endpoint for the account; the account ID comes from terraform/.env,
# loaded before running the playbook (see ansible/README.md, "Usage").
backup_cloudflare_account_id: "{{ lookup('ansible.builtin.env', 'TF_VAR_cloudflare_account_id') | trim }}"
backup_endpoint: "https://{{ backup_cloudflare_account_id }}.r2.cloudflarestorage.com"
backup_rclone_provider: Cloudflare
# systemd calendar time, UTC: before the automatic reboot window (07:30).
backup_time: "03:30:00"
# The login warning shows when the last successful backup is older than this.
backup_max_age_hours: 26
# The automatic restore test (backup-restore test) runs on these servers: the
# playbook makes their test key and timer, and Gatus waits for their Restore
# test heartbeat. Production joins in a pull request of its own.
backup_restore_test_servers:
  - server.abrunacci.dev
backup_restore_test: "{{ inventory_hostname in backup_restore_test_servers }}"
# Its systemd calendar time, UTC: after the backup (backup_time) and before
# the reboot window (07:30).
backup_test_time: "05:00:00"
# Its key: the same path as BACKUP_TEST_KEY in scripts/backup-lib.sh.
backup_test_key: /etc/infra/secrets/backup/restore-test.key
