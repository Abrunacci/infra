---
# Pinned by digest, like Caddy. A minor bump (17.x) is a pull and a restart;
# a major one (18) needs a dump and restore, never just a new tag: the role
# refuses to start an image whose major version is not the data's.
postgres_image: postgres:17.11-trixie@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
# Fixed name, so it does not depend on the compose project name. Also in
# roles/projects/defaults (the database check): rename them together.
postgres_volume: postgres_data
postgres_dir: "{{ infra_opt_dir }}/postgres"
# Superuser password, generated on the server on the first run. PostgreSQL
# reads it only when it initializes the data directory.
postgres_password_file: "{{ infra_secrets_dir }}/postgres.password"
# UID of the postgres user inside the Debian-based image.
postgres_container_uid: 999

# Sized for the 2 GB Droplet, shared with the project containers.
postgres_memory_limit: 768m
postgres_shared_buffers: 256MB
postgres_effective_cache_size: 768MB
postgres_max_connections: 50
