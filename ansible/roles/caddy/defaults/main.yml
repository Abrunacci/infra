---
# Pinned by digest: a tag can be moved, a digest cannot. Upgrading is a PR
# that bumps both.
caddy_image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
caddy_dir: "{{ infra_opt_dir }}/caddy"
caddy_memory_limit: 256m
# Half of the Droplet's one CPU, like each backend (projects.yml, cpus): a
# flood of requests slows Caddy down instead of starving PostgreSQL and the
# backends. TLS handshakes are the expensive part.
caddy_cpus: 0.5
# Access log: one JSON line per request, for every site, written by Caddy to
# a file on the host (mounted at the same path). Not the journal: journald
# takes at most 10,000 entries every 30 s from Docker, all containers
# together, so a flood of requests would crowd out the backends' logs and
# rotate them away. It holds personal data (visitors' addresses and the paths
# they asked for; query strings are cut): Caddy rotates it at
# caddy_access_log_roll_size, keeps caddy_access_log_roll_keep old files
# (gzipped), and deletes any older than caddy_access_log_keep_for.
# Caddy keeps the open file across reloads: a change to these three takes
# effect when the container is recreated or restarted.
caddy_log_dir: /var/log/caddy
caddy_access_log_roll_size: 20MiB
caddy_access_log_roll_keep: 10
caddy_access_log_keep_for: 336h  # 14 days
# uid and gid of the caddy user. Fixed, so it never matches the uid of the postgres container (999) or of a
# system user created later (system uids are handed out downwards from 999).
caddy_uid: 10001

# Optional. With an email, the CAs can warn about expiring certificates and
# problems with the account. Caddy renews on its own either way.
caddy_acme_email: ""
