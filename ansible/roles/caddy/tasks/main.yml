---
# Caddy runs as this unprivileged user inside the container. It owns the
# certificates and their private keys, and nothing else.
- name: Create the caddy system group
  ansible.builtin.group:
    name: caddy
    gid: "{{ caddy_uid }}"
    system: true

- name: Create the caddy system user
  ansible.builtin.user:
    name: caddy
    uid: "{{ caddy_uid }}"
    group: caddy
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the Caddy directories
  ansible.builtin.file:
    path: "{{ caddy_dir }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "", owner: root, mode: "0755" }
    - { path: conf, owner: root, mode: "0755" }
    # One file per project (<project>.caddy), added by the projects role.
    - { path: conf/sites, owner: root, mode: "0755" }
    # Certificates, private keys and ACME account.
    - { path: data, owner: caddy, mode: "0700" }
    - { path: config, owner: caddy, mode: "0700" }
  loop_control:
    label: "{{ item.path or '.' }}"

# The access log (caddy_log_dir). Caddy writes it; only root reads it.
- name: Create the Caddy log directory
  ansible.builtin.file:
    path: "{{ caddy_log_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

# Static sites live here (roles/projects). Caddy mounts it read-only; it
# exists before Caddy starts, so Docker never creates it itself.
- name: Create the static sites directory
  ansible.builtin.file:
    path: /srv/sites
    state: directory
    owner: root
    group: root
    mode: "0755"

# Used by roles/projects to validate each site file before writing it.
- name: Install the site validation command
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/caddy-validate-site"
    dest: /usr/local/sbin/caddy-validate-site
    owner: root
    group: root
    mode: "0755"

# quic-go (HTTP/3) asks for 7.5 MB socket buffers and logs a warning if the
# kernel limit is lower.
- name: Raise the UDP buffer limits for HTTP/3
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "7500000"
    sysctl_file: /etc/sysctl.d/60-infra.conf
    state: present
  loop:
    - net.core.rmem_max
    - net.core.wmem_max

# The whole conf directory is mounted, not the file: templating replaces the
# file, and a single-file bind mount would keep showing the old one.
- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/conf/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    # Checked in a throwaway container, with the same restrictions as Caddy,
    # before it replaces the current file. An invalid Caddyfile left on disk
    # would stop Caddy at its next restart.
    validate: >-
      docker run --rm --network none --read-only --user {{ caddy_uid }}:{{ caddy_uid }}
      --tmpfs /var/log/caddy:uid={{ caddy_uid }},gid={{ caddy_uid }},mode=0700
      --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges
      -v %s:/etc/caddy/Caddyfile:ro -v {{ caddy_dir }}/conf/sites:/etc/caddy/sites:ro
      {{ caddy_image }} caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  notify: Reload Caddy

# One per public backend (edge_project_networks): Caddy joins them all, each
# backend only its own. Labelled, so roles/projects can find and remove the
# ones whose project is gone. They exist before Caddy starts, and before the
# first deploy of their backend.
- name: Create the project networks
  community.docker.docker_network:
    name: "{{ item }}"
    internal: false
    labels:
      infra.network: project
    state: present
  loop: "{{ edge_project_networks }}"
  register: caddy_project_networks

# Caddy is recreated just below, and each backend by roles/projects
# (backend-rollback --apply), with their aliases.
- name: Take the containers off the recreated project networks
  ansible.builtin.import_role:
    name: docker
    tasks_from: detach-recreated
  vars:
    docker_recreated_networks: >-
      {{ caddy_project_networks.results | selectattr('changed') | map(attribute='item') | list }}

- name: Write the Caddy compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ caddy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

# Recreates the container when compose.yml or the image changes; otherwise
# leaves it running. Adding or removing a public backend changes its networks,
# so Caddy is recreated then: a few seconds without any site.
- name: Start Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 120

# Reload now: if a later role failed, the pending reload would be lost and the
# next run would see no change to trigger it.
- name: Apply Caddyfile changes now
  ansible.builtin.meta: flush_handlers

# Only here, with Caddy healthy on the new image: if it had not started, the
# play would have stopped above, and the old image would still be here.
- name: Remove older Caddy images
  ansible.builtin.command:
    argv: [/usr/local/sbin/prune-images, "{{ caddy_image }}"]
  register: caddy_prune
  changed_when: caddy_prune.stdout | length > 0
