# Managed by Ansible (roles/caddy). One failure per line of Caddy's access log
# answered 401 or 429: a wrong password or token, or a backend's own rate
# limit.
#
# Anchored at the start of the line, where Caddy writes the fields in a fixed
# order: the address is the client_ip Caddy itself recorded, before any
# request header, and a header value cannot fake a field (JSON escapes its
# quotes). The status is the last field.
[Definition]

failregex = ^[\d.]*,"logger":"http\.log\.access[^"]*","msg":"handled request","request":\{"remote_ip":"[^"]*","remote_port":"\d*","client_ip":"<ADDR>",.*,"status":(?:401|429)\}$

ignoreregex =

# The line must start with the level and "ts", a Unix time with a fraction.
# fail2ban cuts a date found at the start of the line, with everything before
# it: failregex starts where the date ends. {EPOCH} takes at most six
# decimals, and Caddy writes up to seven, so the rest of the fraction may be
# left over.
datepattern = ^\{"level":"[^"]+","ts":({EPOCH})
