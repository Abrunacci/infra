# Managed by Ansible (roles/caddy). Every line of Caddy's access log counts,
# whatever its status: the jail bans an address that sends too many requests.
#
# Anchored like caddy-auth.conf: the address is the client_ip Caddy recorded,
# which no request header can fake.
[Definition]

failregex = ^[\d.]*,"logger":"http\.log\.access[^"]*","msg":"handled request","request":\{"remote_ip":"[^"]*","remote_port":"\d*","client_ip":"<ADDR>",

ignoreregex =

# As in caddy-auth.conf: failregex starts where the date ends.
datepattern = ^\{"level":"[^"]+","ts":({EPOCH})
