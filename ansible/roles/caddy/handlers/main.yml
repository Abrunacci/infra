---
# A graceful reload with no downtime. If the new config is invalid, Caddy
# rejects it, keeps serving the old one and the task fails.
- name: Reload Caddy
  community.docker.docker_compose_v2_exec:
    project_src: "{{ caddy_dir }}"
    service: caddy
    command: caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
