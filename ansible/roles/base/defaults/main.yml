---
# Swap file size. Created once: changing it later does not resize the file.
base_swap_size_mb: 2048
# Low swappiness: swap is a cushion against OOM, not extra memory.
base_swappiness: 10

# unattended-upgrades installs security updates daily and reboots when one
# needs it (kernel, libc). apt-daily-upgrade runs at 06:00-07:00 UTC, so the
# reboot happens the same night. Containers come back through their restart policy.
base_auto_reboot: true
base_auto_reboot_time: "07:30"  # UTC (04:30 in Argentina)
