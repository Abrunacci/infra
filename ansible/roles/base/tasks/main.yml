---
- name: Check the connection user and the admin SSH keys
  ansible.builtin.assert:
    that:
      # hardening allows only admin_user to log in over SSH.
      - ansible_user | default(admin_user) == admin_user
      - admin_ssh_public_keys | length > 0
      - >-
        admin_ssh_public_keys | select('match', base_ssh_key_regex) | list | length
        == admin_ssh_public_keys | length
    fail_msg: >-
      ansible_user must be admin_user ({{ admin_user }}), and admin_ssh_public_keys must hold one or more
      single-line OpenSSH public keys. Is TF_VAR_admin_ssh_public_key exported?
    quiet: true
  vars:
    # Same formats Terraform accepts (terraform/variables.tf).
    base_ssh_key_regex: >-
      ^(ssh-ed25519|sk-ssh-ed25519@openssh\.com|ecdsa-sha2-nistp256|ssh-rsa) [A-Za-z0-9+/=]+( [^\n]*)?$

- name: Install the admin SSH keys and remove any other
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_keys | join('\n') }}"
    exclusive: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable daily security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (roles/base).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    # Read after the package's 50unattended-upgrades, so these values win.
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

# One step, so a half-created file is never left behind: if mkswap fails, the
# file is removed and the next run tries again.
- name: Create the swap file
  ansible.builtin.shell:
    cmd: >-
      umask 077 && fallocate -l {{ base_swap_size_mb }}M /swapfile && mkswap /swapfile
      || { rm -f /swapfile; exit 1; }
    creates: /swapfile

- name: Mount the swap file at boot
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Turn swap on
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: ansible_facts.swaptotal_mb == 0
  changed_when: true

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ base_swappiness }}"
    sysctl_file: /etc/sysctl.d/60-infra.conf
    state: present

- name: Create the infra directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/infra, mode: "0755" }
    - { path: "{{ infra_secrets_dir }}", mode: "0700" }
    - { path: "{{ infra_opt_dir }}", mode: "0755" }
