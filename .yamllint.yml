extends: default

rules:
  # GitHub Actions uses the bare `on:` key.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  # Compatible with ansible-lint's yaml rules.
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
