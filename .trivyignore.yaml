# Findings Trivy reports that are accepted, each with why (README.md,
# "Security scan"). Read by both scans: `trivy config` in CI and the weekly
# image scan (.github/workflows/security-scan.yml). A vulnerability with
# expired_at is only accepted until that date: after it, it fails the scan
# again. One without it is accepted until the image no longer has it: the
# weekly scan then fails, saying it can be removed from here.

---
misconfigurations:
  - id: DIG-0001
    paths: [terraform/firewall.tf]
    statement: >-
      Inbound from anywhere is the point of the firewall: HTTP and HTTPS for the sites, ICMP, and SSH, which
      takes keys only and has fail2ban (README.md, "Firewall: SSH, HTTP(S) and ICMP only").
  - id: DIG-0001
    paths: [terraform/production.tf]
    statement: >-
      The production Droplet's firewall: HTTP and HTTPS for the sites, ICMP, and UDP 41641, where only
      Tailscale (WireGuard, authenticated peers) answers. No SSH from the internet.
  - id: DIG-0003
    paths: [terraform/firewall.tf, terraform/production.tf]
    statement: >-
      Outbound to anywhere: certificates, images, backups, email and the backends' own calls need it.
      Restricting the backends' egress is a later step of the security audit (step 11).
vulnerabilities:
  - id: CVE-2025-68121
    paths: [usr/local/bin/gosu]
    statement: >-
      In the postgres image, gosu's Go standard library (crypto/tls session resumption). gosu only drops to
      the postgres user when the container starts and makes no TLS connection, so the flaw cannot be reached
      there. On 2026-11-12 every postgres 17.11 image (trixie, bookworm, alpine) still shipped gosu 1.19 built
      with Go 1.24.6. Accepted with no date until an image ships a rebuilt gosu: the weekly scan fails once
      the finding is gone, and then this entry goes.
