---
# Registry of the domains and the deployed projects: the single source of
# truth for Terraform (one DNS zone per domain, one DNS record per hostname)
# and Ansible (roles/projects). Adding a project starts with a new entry here.
# Schema: projects.schema.json.
#
# domains: every domain the servers answer for, each a Cloudflare zone whose ID
# is in terraform/.env (TF_VAR_cloudflare_zone_ids). The first one holds the
# status page (status.<domain>), and every project without a domain.
#   name       the domain, such as abrunacci.dev
#   mail_forward
#              local parts Cloudflare Email Routing forwards to the inbox in
#              terraform/.env (TF_VAR_email_forward_to), such as hello for
#              hello@<domain>. Optional
#   proton     Proton Mail hosts the domain's mail instead: verification is
#              the value Proton shows for its TXT record (after
#              protonmail-verification=), and dkim the part its DKIM CNAMEs
#              share (protonmail.domainkey.<dkim>.domains.proton.ch), which
#              Proton shows once the domain is verified. Optional, not with
#              mail_forward.
#              A domain with neither receives no mail and may send none
#              (null MX, SPF -all)
#
# servers: every server (Droplet), by its hostname, the same name Ansible's
# inventory uses. Each one is a name under one of the domains, where Terraform
# creates its A/AAAA records, and has its own Droplet in Terraform. The first
# one serves the status page and runs every project without a server.
#   name       the hostname, such as server.abrunacci.dev
#
# projects:
#   name       directories, registry entry and, with a database, the database
#              and user (with - turned into _). Used once per server: a
#              project on two servers is two entries with the same name, each
#              with its own server (and its own hostnames, title and
#              deploy_key, which are unique in the whole file)
#   server     one of the servers above (optional, defaults to the first): its
#              DNS records point there, and only that server's playbook run
#              sets the project up
#   domain     one of the domains above (optional, defaults to the first)
#   redirect_from
#              other hostnames that send visitors to the project with a 301,
#              keeping the path, such as another domain it goes by. Each one
#              a domain above or a name under one (optional, only with a
#              subdomain)
#   also_serves
#              other hostnames that serve the same site and backend, with no
#              redirect: a list of {name, noindex}. name: a domain above or a
#              name under one; noindex: true sends X-Robots-Tag: noindex on
#              that name only (optional, only with a subdomain)
#   subdomain  DNS record and Caddy site, under the project's domain. "@"
#              (quoted) is the domain itself; www then redirects to it.
#              server, status and www are reserved. Optional: without it the
#              project is internal (no DNS record, no Caddy site), has no
#              site, and its backend has no port, health or paths
#   title      shown on the placeholder page, and the project's group on the
#              status page, so unique among the projects with a subdomain
#              (optional, defaults to name)
#   repo       linked from the placeholder page (optional: leave it out for
#              private repositories)
#   site       true: Caddy serves /srv/sites/<name>/current
#   database   true: a PostgreSQL database and roles; needs a backend, and a
#              name of 59 characters at most. Never undone by the playbook:
#              while the database exists, taking the project out of this file
#              or setting false makes every run fail. See ansible/README.md,
#              "Retiring a project with a database".
#   permissions_policy
#              the site's Permissions-Policy header (optional, only with a
#              subdomain): replaces the default, which turns off the camera,
#              microphone, location and other powerful features
#              (roles/caddy, caddy_permissions_policy). The whole policy,
#              such as "camera=(self), microphone=(), geolocation=()"
#   referrer_policy
#              the site's Referrer-Policy header (optional, only with a
#              subdomain), such as no-referrer: replaces the default
#              (strict-origin-when-cross-origin), and the backend cannot
#              replace it either
#   content_security_policy
#              the site's whole Content-Security-Policy header (optional,
#              only with a subdomain): replaces the default (frame-ancestors
#              'none'), and the backend cannot replace it either. Directives
#              separated by "; ", with frame-ancestors among them, no double
#              quotes or braces
#   deploy_key public ed25519 key of the project's CI (optional: without it the
#              project cannot be deployed). It can only deploy this project:
#              its site, its backend or both. How to create it:
#              ansible/README.md, "Deploying a project".
#   backend    optional container, deployed by CI with deploy-backend:
#                image    repository without tag (CI sends the digest)
#                port     port it listens on (only with a subdomain)
#                health   health check path, with its prefix; any 2xx is healthy
#                         (only with a subdomain; without one, the image's own
#                         HEALTHCHECK must report healthy)
#                paths    paths Caddy sends to it; required with a site, and
#                         left out without one (it then gets every path)
#                private_paths
#                         paths Caddy answers 404, even inside paths: only
#                         other containers may call them (only with a
#                         subdomain; optional)
#                env      non-secret variables, public: quoted strings
#                secrets  names only, each generated, manual or optional (a
#                         manual one the backend also runs without); the values
#                         live on the server (sudo project-secret). Or
#                         {from: PROJECT, key: KEY}: another project's secret,
#                         copied by the server, plus a private network to that
#                         project's backend (link-PROJECT), reached as
#                         http://PROJECT-backend:PORT
#                memory   64m to 512m (optional, defaults to 256m)
#                max_body largest request body Caddy passes to it, such as
#                         64KB (optional, only with a subdomain, defaults to
#                         10MB); larger ones get 413
#                client_ip_header
#                         a request header Caddy sets to the visitor's address,
#                         replacing any the visitor sent, such as
#                         CF-Connecting-IP for a backend that reads it there
#                         (optional, only with a subdomain)
#                cpus     share of the Droplet's CPU it may use, 0.1 to 1
#                         (optional, defaults to 0.5), so one busy backend
#                         cannot starve the others, Caddy or PostgreSQL
#                migrate  with a database: the migrations' command, run before
#                         each deploy switches, such as [alembic, upgrade, head]
#                database_url_scheme
#                         with a database: the scheme of DATABASE_URL and
#                         MIGRATION_DATABASE_URL (optional, postgresql)
#                log_alerts
#                         log lines to be emailed about, checked every 5
#                         minutes (optional): each rule has a name, match (Python
#                         regular expressions, single-quoted; a line matches
#                         when all are found in it) and a note, what the line
#                         means; optionally a subject (a pattern with named
#                         groups and a format that uses them) built from the
#                         line. The lines are emailed as logged: never match
#                         lines with personal data. See ansible/README.md,
#                         "Log alerts".
domains:
  - name: abrunacci.dev
    # hello is the public contact address; postmaster and abuse are the
    # addresses RFC 5321 and RFC 2142 expect.
    mail_forward: [hello, postmaster, abuse]
  # EPB Stock's own domain. Its mail (contacto@) is in Proton Mail.
  - name: epbstock.com.ar
    proton:
      verification: 1403d4dd875513c53e423cf0ece55313a73070a6
      dkim: dhxegrls23tlcj574wzw3n5ftazt6c6s24if73wzhzasdpqb3hxva
  # Redirects to epbstock.com.ar; receives and sends no mail.
  - name: epbstock.com

servers:
  # The one Droplet: every project runs here.
  - name: server.abrunacci.dev

projects:
  - name: cuanto-cuesta
    subdomain: cuanto-cuesta
    title: "¿Cuánto cuesta?"
    repo: https://github.com/Abrunacci/cuanto-cuesta
    site: true
    database: true
    deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICpY4pPwbax2IDkkw0zvPWsFXQ6DAxkLUBbxWsEJ6939 cuanto-cuesta-deploy
    backend:
      image: ghcr.io/abrunacci/cuanto-cuesta-backend
      port: 8000
      health: /api/health
      paths: ["/api/*"]
      # The ingest endpoint is never public: data-pipeline reaches it on
      # link-cuanto-cuesta (its secret links here), not through Caddy.
      private_paths: ["/api/ingest", "/api/ingest/*"]
      secrets:
        INGEST_TOKEN: generated
      # 105 MiB peak on 2026-10-16, with jobs from data-pipeline: twice that,
      # rounded up to 64m, is 256m (issue #79).
      memory: 256m
      migrate: [alembic, upgrade, head]
      database_url_scheme: postgresql+psycopg
      # Prices and sources only, no personal data. The other jump_* events
      # (held, confirming, discarded) are not emailed.
      log_alerts:
        - name: jump_confirmed
          # The line (cuanto-cuesta #33): WARNING:     cuanto_cuesta.ingest: batch <id>: item <n> (<quote>)
          # jump_confirmed: <old> replaced by <new> after <n> readings agreed with <first jump>. Card values
          # may add "(estimate x)" to <old> and <new>.
          match: ['cuanto_cuesta\.ingest', '\bjump_confirmed\b']
          note: >-
            Informational, nothing to do: a reading that jumped past the threshold confirmed itself and is now the
            current one (a real market move, or a source that broke for good).
          subject:
            pattern: '\((?P<quote>\S+)\) jump_confirmed: (?P<old>.+?) replaced by (?P<new>.+?) after \d+ readings'
            format: '{quote} {old} → {new}'

  - name: abrunacci-dev
    subdomain: "@"
    title: Alejandro Brunacci
    repo: https://github.com/Abrunacci/abrunacci.dev
    site: true
    database: false
    deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJITKgKgF+4yXbqYGiYVx4Z26x/rf0qn9/gqE2KMu1pJ abrunacci-dev-deploy
    # The contact form (backend/ in the abrunacci.dev repository). Its log
    # holds nothing a visitor typed: only each event, its reason, an ID, the
    # time and the message's length.
    backend:
      image: ghcr.io/abrunacci/abrunacci-dev-backend
      port: 8000
      health: /api/health
      paths: ["/api/*", "/contact"]
      env:
        MAIL_FROM: "Formulario abrunacci.dev <no-reply@mail.abrunacci.dev>"
        # Caddy's Compose service name: Docker's DNS answers with Caddy's
        # address on edge-abrunacci-dev, the only network the two share. Only
        # a connection from it may set X-Forwarded-For (Caddy has no
        # trusted_proxies, so it always writes the visitor's address there).
        TRUSTED_PROXY: "caddy"
        # Turnstile's site key (terraform/turnstile.tf, terraform output
        # turnstile_site_key). Public: every visitor's browser gets it.
        TURNSTILE_SITE_KEY: "0x4AAAAAAFPXTGN0VTSfeEjN"
      secrets:
        # Turnstile's secret key (terraform/turnstile.tf), from terraform output
        # -raw turnstile_secret_key. The backend checks each form against
        # challenges.cloudflare.com:443, so a future filter on the containers'
        # outbound traffic must allow it.
        TURNSTILE_SECRET_KEY: manual
        # A Resend key with sending access only (abrunacci-dev-contact).
        RESEND_API_KEY: manual
        # Signs the form's time token. A new value invalidates open forms.
        FORM_SECRET: generated
        # The inbox the messages go to, set on the server.
        MAIL_TO: manual
      memory: 128m
      # A name, an email and a message: a few KB at most.
      max_body: 64KB

  # EPB Stock's landing (landing/ in the EPB_Stock repository), on its own
  # domain. The app is at app.epbstock.com.ar (epb-stock, below).
  - name: epb-landing
    domain: epbstock.com.ar
    subdomain: "@"
    redirect_from: [epbstock.com, www.epbstock.com]
    # Not just "EPB Stock": that is the app's, and each title is a group on the
    # status page.
    title: EPB Stock (landing)
    site: true
    database: false
    # The landing's CI (EPB_Stock's secret LANDING_DEPLOY_SSH_KEY): it can only
    # deploy this site.
    deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHFksYvfS1BuO4OQ875YBm4+iaTKvLqBFiYpjZZisqSJ epb-landing-deploy
    # The policy the landing documents (landing/README.md, "Deploy"): its own
    # origin, plus Turnstile (terraform/turnstile.tf), which loads a script and
    # a frame from challenges.cloudflare.com, and Web Analytics
    # (terraform/analytics.tf), whose script reports to cloudflareinsights.com.
    content_security_policy: >-
      default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com;
      style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://cloudflareinsights.com;
      frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self';
      frame-ancestors 'none'
    # The «Solicitá una demo» form (landing/backend in the EPB_Stock
    # repository): it checks the Turnstile token and mails the request through
    # Resend; it stores nothing and never talks to the app. Its log holds
    # nothing a visitor typed.
    backend:
      image: ghcr.io/abrunacci/epb-landing-backend
      port: 8080
      health: /api/health
      paths: ["/api/*"]
      # The backend counts each visitor by this header (5 messages per address
      # per hour) and passes it to Turnstile. The site does not go through
      # Cloudflare's proxy, so nobody else sets it: without this line, every
      # visitor would be Caddy's address, and one would be enough to use up
      # the hour for everybody.
      client_ip_header: CF-Connecting-IP
      env:
        # Explicit, so a new default in an EPB release changes nothing here.
        CONTACT_TO: "contacto@epbstock.com.ar"
        CONTACT_FROM: "EPB Stock <landing@mail.abrunacci.dev>"
        # The hostname Turnstile must report for a token to count: the
        # widget's only domain (terraform/turnstile.tf).
        ALLOWED_HOSTNAME: "epbstock.com.ar"
      secrets:
        # The landing widget's secret key (terraform/turnstile.tf), from
        # terraform output -raw epb_landing_turnstile_secret_key. The backend
        # checks each form against challenges.cloudflare.com:443, so a future
        # filter on the containers' outbound traffic must allow it.
        TURNSTILE_SECRET_KEY: manual
        # A Resend key with sending access only, on mail.abrunacci.dev
        # (epb-landing-contact): not the app's, so either can be revoked alone.
        # It calls api.resend.com:443.
        RESEND_API_KEY: manual
      # One small Python process: 41 MiB after a burst of submissions, in a
      # test with the same limits as the server (2026-10-21).
      memory: 128m
      # The backend refuses bodies over 16 KB itself; Caddy stops anything
      # past 20KB first.
      max_body: 20KB

  - name: epb-stock
    domain: epbstock.com.ar
    subdomain: app
    # The app's first address, which old links, bookmarks and invitations
    # still use: it redirects here until 2027-04-30, and then goes (issue #108).
    # Never for Mercado Pago's webhook: a redirected notification is not
    # delivered, so its URL is https://app.epbstock.com.ar/api/... itself.
    redirect_from: [epb.abrunacci.dev]
    # The demo's name, until production has its own server: the same app and
    # database as app., kept out of search engines.
    also_serves:
      - name: stage.epbstock.com.ar
        noindex: true
    title: EPB Stock
    site: true
    database: true
    # Invitation links carry ?token=: not even the origin goes to another site.
    referrer_policy: no-referrer
    # The policy EPB documents (docs/production-environment.md, "Headers the
    # site needs"): everything from the site's own origin, nothing inline.
    content_security_policy: >-
      default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self';
      connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
    deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMB6oIcQR/2AStIyAJjIVXcGkgxd4sKd2S0+9lOo54w/ epb-stock-deploy
    backend:
      image: ghcr.io/abrunacci/epb-stock-backend
      port: 8000
      health: /api/health
      paths: ["/api/*"]
      # The API's documentation, if a release turns it on: never public. Each
      # path also with /*: Caddy's `path /api/redoc` does not match /api/redoc/.
      private_paths: ["/api/docs", "/api/docs/*", "/api/redoc", "/api/redoc/*", "/api/openapi.json",
                      "/api/openapi.json/*"]
      # The API takes up to 6 MiB on its import routes and 1 MB elsewhere,
      # counting the bytes it reads. Caddy is the first line, just above the
      # largest: 7MB is 6.68 MiB, so no import the API accepts hits it.
      max_body: 7MB
      env:
        # The links in its emails (invitations, password resets, the
        # subscription's notices) and the only origin allowed to call the API.
        PUBLIC_APP_URL: "https://app.epbstock.com.ar"
        # Also the origins EPB accepts writes from (its same-origin check): every
        # name in also_serves must be here, or logging in there is refused.
        CORS_ORIGINS: "https://app.epbstock.com.ar,https://stage.epbstock.com.ar"
        TRUST_FORWARDED_FOR: "true"
        MAIL_BACKEND: "resend"
        MAIL_FROM: "EPB Stock <no-reply@mail.abrunacci.dev>"
        # Explicit, so a new default in an EPB release changes nothing here.
        # No COOKIE_DOMAIN: without one, the cookie is app.epbstock.com.ar's only.
        COOKIE_SECURE: "true"
        DEBUG: "false"
        FEATURE_MANUFACTURING: "false"
        # uvicorn's access log is off: it logs each URL whole, ?token= included,
        # with Caddy's address. Caddy's access log is the one: the visitor's
        # address, query strings cut, kept 14 days (roles/caddy).
        UVICORN_ACCESS_LOG: "false"
      secrets:
        SECRET_KEY: generated
        RESEND_API_KEY: manual
        SETUP_TOKEN: generated
        # The import's suggestions: a Claude API key (epb-produccion) from EPB's
        # own Anthropic workspace, which has a spending limit. Without it, EPB
        # runs without suggestions. Its expiry: terraform/README.md, "Credentials".
        # Only the worker gets it (below), and calls api.anthropic.com:443, so
        # a future filter on the containers' outbound traffic must allow it.
        ANTHROPIC_API_KEY: optional
        # The model the analysis uses, if set; without it, EPB's own default.
        IMPORT_AI_MODEL: optional
        # Mercado Pago (EPB #106): the Access Token of EPB's application
        # (production credentials) charges the subscriptions; the API and the
        # worker both get it. Without it, the «Suscripción» screen says payments
        # are not set up, and nothing else changes. Both call
        # api.mercadopago.com:443, so a future filter on the containers'
        # outbound traffic must allow it.
        MP_ACCESS_TOKEN: optional
        # The webhook's secret key, in the same application: the API checks
        # every notification against it, and refuses them all without it.
        MP_WEBHOOK_SECRET: optional
      # Twice its peak, rounded up to 64m (issue #79): 131 MiB on 2026-10-16,
      # with a full real import going through the worker. `migrate` gets it too.
      memory: 320m
      migrate: [alembic, upgrade, head]
      database_url_scheme: postgresql+psycopg
      # The jobs process (EPB issue #209): the import's AI analysis and its
      # final step, off the API. Same image and release as the API, so every
      # deploy and rollback moves both. While it is down, the API sees no
      # signal from it and does that work itself, without the analysis.
      worker:
        command: [python, -m, epb_stock.jobs]
        # Exits 0 if the worker left its signal in the database in the last
        # 30 s (it does every 10 s). Deploys wait for it, and the status
        # page's "epb-stock / Worker" heartbeat alerts when it fails.
        health: [python, -m, epb_stock.jobs, check]
        # The largest import is now its work: 232 MiB peak on 2026-10-16 with a
        # full real import (issue #79), under the 256 MiB that 512m allows.
        memory: 512m
        # Room to finish a job; one still running then goes back to the queue.
        stop_grace_period: 30s
        # Secrets only it gets, and the API no longer does. No SECRET_KEY or
        # SETUP_TOKEN: it signs nothing. It also gets DATABASE_URL (the app's
        # role, like the API).
        secrets: [ANTHROPIC_API_KEY, IMPORT_AI_MODEL]
        # Secrets it gets as well as the API: it sends the subscription's
        # notices by email, and brings a new price to each subscription when
        # Mercado Pago did not take it at once (EPB #106).
        shared_secrets: [MP_ACCESS_TOKEN, RESEND_API_KEY]

  # Internal: a scheduler that runs data jobs, with no public route. Its
  # image's HEALTHCHECK says whether it is alive.
  - name: data-pipeline
    repo: https://github.com/Abrunacci/data-pipeline
    site: false
    database: false
    # CI key: it can only run deploy-backend for this project (no site).
    deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIQIv0wZsZBIrRSCcfa9Sjtqc4LBabBWAkrJ6BydVnYf data-pipeline-deploy
    backend:
      image: ghcr.io/abrunacci/data-pipeline
      env:
        # Checked by the playbook: the host and port must be cuanto-cuesta's,
        # which a secret below links to.
        CUANTO_CUESTA_INGEST_URL: "http://cuanto-cuesta-backend:8000/api/ingest"
      secrets:
        # The same value as cuanto-cuesta's INGEST_TOKEN, which stays its only
        # source: rotate it there (sudo project-secret cuanto-cuesta rotate INGEST_TOKEN).
        CUANTO_CUESTA_INGEST_TOKEN: {from: cuanto-cuesta, key: INGEST_TOKEN}
      # Twice its peak, rounded up to 64m (issue #79): 76 MiB with two days of
      # jobs, on 2026-10-16.
      memory: 192m
